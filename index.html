<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c20">
  <script id="relaxs-local-file-entry">
    if (location.protocol === 'file:') {
      location.replace(new URL('./dist/index.html' + location.hash, location.href).href);
    }
  </script>
  <meta name="description" content="Relaxs，你的片刻小宇宙。选一个星球，玩一会、静一会，或随心闹一会。">
  <title>Relaxs · 你的片刻小宇宙</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/planet.css">
  <link rel="stylesheet" href="./src/hoops.css">
  <link rel="stylesheet" href="./src/arcade.css">
  <link rel="stylesheet" href="./src/experience.css">
  <link rel="stylesheet" href="./src/games.css">
  <link rel="stylesheet" href="./src/play.css">
  <link rel="stylesheet" href="./src/destruction-hub.css">
  <link rel="stylesheet" href="./src/demolition.css">
  <link rel="stylesheet" href="./src/blast.css">
  <link rel="stylesheet" href="./src/crusher.css">
  <link rel="stylesheet" href="./src/moles.css">
  <link rel="stylesheet" href="./src/calm.css">
  <link rel="stylesheet" href="./src/release.css">
  <link rel="stylesheet" href="./src/slice.css">
  <link rel="stylesheet" href="./src/ride.css">
  <link rel="stylesheet" href="./src/dive.css">
  <link rel="stylesheet" href="./src/relaxs-polish.css">
  <link rel="stylesheet" href="./src/experience-layout.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body class="planet-app" data-view="orbit" data-planet="play">
  <a class="skip-link" href="#planet-info">跳到星球选择</a>
  <div class="space-grain" aria-hidden="true"></div>
  <header class="space-header">
    <a class="space-brand" href="#orbit/play" aria-label="Relaxs 首页">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="10"/><ellipse cx="20" cy="20" rx="19" ry="6.5" transform="rotate(-35 20 20)"/><circle class="brand-dot" cx="32" cy="9" r="2.5"/></svg>
      <span>Relaxs<span class="brand-period">.</span></span>
    </a>
    <span class="header-note"><i aria-hidden="true"></i>一点空闲，留给自己</span>
    <button class="back-button" id="back-to-orbit" hidden><span aria-hidden="true">↖</span> 返回星球</button>
  </header>
  <main class="universe" id="universe">
    <div class="lobby-heading" id="lobby-heading">
      <p class="eyebrow">A LITTLE SPACE, JUST FOR YOU</p>
      <h1>换个星球，<span>歇一会。</span></h1>
      <p class="heading-note">此刻，你想去哪里？</p>
    </div>
    <section class="planet-stage" aria-label="三个可选择的小星球" id="planet-stage">
      <div class="stage-glow" aria-hidden="true"></div>
      <div class="orbit-line orbit-line-one" aria-hidden="true"></div>
      <div class="orbit-line orbit-line-two" aria-hidden="true"></div>
      <canvas id="planet-canvas" aria-hidden="true"></canvas>
      <div class="fallback-world" aria-hidden="true"><i></i><b></b></div>
      <div class="planet-hit-targets" id="planet-hit-targets">
        <button class="planet-hit planet-hit-left" id="previous-planet"><span class="neighbor-label"></span></button>
        <button class="planet-hit planet-hit-center" id="selected-planet" aria-label="进入玩一会"></button>
        <button class="planet-hit planet-hit-right" id="next-planet"><span class="neighbor-label"></span></button>
      </div>
      <button class="orbit-arrow orbit-arrow-left" id="previous-arrow" aria-label="选择上一个星球">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <button class="orbit-arrow orbit-arrow-right" id="next-arrow" aria-label="选择下一个星球">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </section>
    <section class="planet-info" id="planet-info" tabindex="-1" aria-label="当前选择的星球">
      <p class="planet-coordinate"><span id="planet-number">01</span><span class="coordinate-line"></span><span id="planet-english">PLAY</span></p>
      <h2 id="planet-name">玩一会</h2>
      <p id="planet-description">换换脑子，让好奇心带你绕个弯。</p>
      <button class="depart-button" id="enter-planet"><span id="enter-label">出发去玩</span><span aria-hidden="true">↗</span></button>
      <nav class="planet-dots" aria-label="直接选择星球">
        <button data-select="play" aria-label="选择玩一会" aria-pressed="true"><i></i></button>
        <button data-select="calm" aria-label="选择静一会" aria-pressed="false"><i></i></button>
        <button data-select="release" aria-label="选择闹一会" aria-pressed="false"><i></i></button>
      </nav>
    </section>
    <div id="experience-mount" hidden></div>
    <p class="render-notice" id="render-notice" role="status" hidden>星球画面暂时中断，仍可切换和进入。<button id="retry-planets" type="button">重新点亮星球 ↗</button></p>
  </main>
  <footer class="space-footer">
    <span class="footer-signature">YOUR LITTLE UNIVERSE</span>
    <p class="keyboard-hint" id="keyboard-hint"><kbd>←</kbd><kbd>→</kbd><span>切换星球</span><i></i><kbd>↵</kbd><span>出发</span></p>
    <span class="footer-coordinate"><i aria-hidden="true"></i>随时可以，回到这里</span>
  </footer>
  <div class="sr-only" id="planet-announcement" role="status" aria-live="polite"></div>
  <noscript><p class="no-script">请启用 JavaScript 查看星球。也可以直接打开<a href="./care.html">原有练习</a>或<a href="./hoops.html">落日球场</a>。</p></noscript>
  <script type="module" src="./src/planet-entry.js"></script>
</body>
</html>
